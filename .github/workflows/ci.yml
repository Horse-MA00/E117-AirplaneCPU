name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend, evidence and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.14.5
      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check backend/server.py backend/tests/test_server_routes.py
      # Backend and root unit tests, publication links and frozen-evidence SHA checks.
      - name: Tests and evidence checks
        run: python scripts/check_container.py

  browser:
    name: Frontend format and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r ../requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Start the offline demo server
        run: |
          (cd .. && python -m backend.server --port 8000 > server.log 2>&1 &)
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1
      # Offline only: no browser check calls a paid LLM provider.
      - name: Browser checks
        env:
          APP_URL: http://127.0.0.1:8000
          PYTHON: python
        run: |
          for script in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(s => s.startsWith('test:')).join(' '))"); do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done
      - name: Server log
        if: failure()
        run: cat ../server.log
